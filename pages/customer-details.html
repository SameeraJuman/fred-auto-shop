<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer - Fred's Auto Electrical</title>
    <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body>
    <!-- the sidebar and top bar are added by src/js/shared/page.js -->

    <div class="flex flex-col">

    <main class="flex-1 p-6 space-y-6 max-w-6xl">

        <!-- back link and actions -->
        <div class="flex flex-wrap items-center justify-between gap-3">
            <a href="/pages/customers.html" class="inline-flex items-center gap-2 text-sm text-muted hover:text-ink transition">
                <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6" /></svg>
                Back to Customers
            </a>

            <div id="actions" class="hidden flex flex-wrap items-center gap-2">
                <button id="edit-btn" class="btn btn-outlined py-2">Edit Customer</button>
                <a id="new-job-link" class="btn btn-outlined py-2">New Job</a>
                <a id="new-appointment-link" class="btn btn-outlined py-2">New Appointment</a>

                <!-- overflow menu, only has items for admins -->
                <div id="more-wrap" class="relative hidden">
                    <button id="more-btn" class="btn btn-outlined py-2 px-2.5" aria-label="More options" aria-expanded="false">
                        <svg class="size-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z" /></svg>
                    </button>
                    <div id="more-menu" class="hidden absolute right-0 mt-2 w-48 card p-1 shadow-2xl shadow-black/40 z-20">
                        <button id="delete-btn" class="w-full text-left px-3 py-2 rounded-lg text-sm text-red-400 hover:bg-red-500/10 cursor-pointer">Delete customer</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- loading / error / not found message -->
        <p id="state-message" class="p-8 text-center text-muted">Loading customer...</p>

        <div id="content" class="hidden space-y-6">

            <!-- customer card -->
            <section class="card p-6 relative overflow-hidden">
                <div class="absolute inset-0 bg-linear-to-br from-accent/5 to-transparent pointer-events-none"></div>
                <div class="relative flex flex-wrap items-start justify-between gap-4">
                    <div class="min-w-0">
                        <h1 id="customer-name" class="font-display text-3xl font-bold tracking-wider uppercase break-words"></h1>
                        <p class="mt-3 text-sm">
                            <span id="customer-phone" class="font-mono font-semibold"></span>
                            <span id="customer-email-wrap" class="hidden"><span class="text-muted mx-2">·</span><a id="customer-email" class="text-muted hover:text-accent"></a></span>
                        </p>
                        <p id="customer-address" class="mt-2 text-xs text-muted"></p>
                    </div>
                    <p id="customer-since" class="font-mono text-xs text-muted"></p>
                </div>
            </section>

            <!-- vehicles -->
            <section>
                <div class="flex items-center justify-between mb-3">
                    <h2 id="vehicles-title" class="font-display text-sm font-bold tracking-widest text-muted"></h2>
                    <button id="add-vehicle-btn" class="btn btn-outlined py-1.5 text-xs">+ Add Vehicle</button>
                </div>
                <div id="vehicles" class="grid gap-4 md:grid-cols-2"></div>
            </section>

            <!-- job history -->
            <section>
                <h2 id="jobs-title" class="font-display text-sm font-bold tracking-widest text-muted mb-3"></h2>
                <div id="jobs" class="card overflow-hidden divide-y divide-line"></div>
            </section>
        </div>
    </main>
    </div>

    <script type="module" src="/src/js/customers/customer-details.js"></script>
</body>
</html>
